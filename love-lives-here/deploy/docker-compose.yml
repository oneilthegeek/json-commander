# Single-server deployment: app + PostgreSQL + Caddy (automatic HTTPS).
# Usage (on the server, in this directory):
#   cp ../.env.example .env && edit .env
#   docker compose up -d --build
#   docker compose run --rm ops tsx scripts/migrate.ts && docker compose run --rm ops tsx scripts/seed.ts
#   docker compose run --rm -it ops tsx scripts/create-staff.ts --email you@example.com --name "You" --role owner
# See docs/DEPLOYMENT.md.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: llh
      POSTGRES_USER: llh_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "llh_app"], interval: 10s }

  app:
    build: ..
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://llh_app:${POSTGRES_PASSWORD}@db:5432/llh
    depends_on: { db: { condition: service_healthy } }

  # One-off jobs: migrations, seed, staff accounts, retention.
  ops:
    build: ..
    profiles: ["ops"]
    working_dir: /app/ops
    entrypoint: ["npx", "--no-install"]
    command: ["tsx", "scripts/retention.ts"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://llh_app:${POSTGRES_PASSWORD}@db:5432/llh
    depends_on: { db: { condition: service_healthy } }

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro, caddydata:/data]
    depends_on: [app]

volumes: { dbdata: {}, caddydata: {} }
